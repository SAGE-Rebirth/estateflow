[project]
name = "estateflow-backend"
version = "0.1.0"
description = "Multi-tenant real estate CRM with a WhatsApp RAG agent (MongoDB + Hugging Face)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "cryptography>=43",
    "python-multipart>=0.0.17",
    "pymongo>=4.13",
    "huggingface_hub>=0.30",
    "numpy>=1.26",
    "anthropic>=0.75",
    "langchain-text-splitters>=0.3",
    "pypdf>=5.1",
    "docx2txt>=0.8",
    "phonenumbers>=8.13",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "UP047"]
